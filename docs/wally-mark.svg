<!-- EDITABLE SOURCE for the browser favicon.

     index.html carries a MINIFIED, URL-ENCODED copy of this file inlined as a
     data: URI (the project ships no binary assets, so there is no .ico/.png).
     Edit THIS file, then re-inline it — do not hand-edit the encoded blob.

     Designed 16px-first: at that size only three things survive — a grey mass,
     a dark bar, an orange line — so those dominate and everything else is
     subordinate to them. Verified by rasterising at 16/20/24/32/48 and
     magnifying, which is the only honest way to judge a favicon.
-->
