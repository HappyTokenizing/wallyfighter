<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WALLY: CRYPTO SMACKDOWN</title>
  <!-- Supplied favicon set (public/), from the official Wally mark.
       Paths are RELATIVE because vite is configured base:'./' — absolute /paths
       would break the moment this is served from anything but a domain root.

       The set also shipped a favicon.svg, deliberately NOT linked here: it
       contains ZERO vector paths — it is a 1332x1078 PNG base64-embedded in an
       SVG wrapper, 2.3 MB. Chrome and Firefox prefer an SVG icon when offered
       one, so linking it would trade a 15 KB .ico for a 2.3 MB download on
       every cold load. The .ico + 96px PNG cover every browser that renders a
       tab. -->
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <meta name="theme-color" content="#05060f" />
  <style>
    html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #ui-root { position: fixed; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
